<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Pagină</title>
<meta name="theme-color" content="#F5F3EE" />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F3EE; --surface: #FFFFFF; --surface2: #FAF8F3;
    --ink: #1C1C1A; --ink2: #3A3A36; --muted: #8A867C;
    --hair: #E5E1D8; --hair2: #EFEBE2;
    --accent: #556B3D; --accentSoft: #EAEEE1;
    --ui: 'Inter', -apple-system, system-ui, sans-serif;
    --serif: 'Fraunces', Georgia, serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); }
  #app { max-width: 520px; margin: 0 auto; padding: 20px 20px 60px; min-height: 100vh; position: relative; z-index: 1; }
  @media (min-width: 521px) { body { background: #E5E1D8; } #app { background: var(--bg); box-shadow: 0 0 0 1px rgba(0,0,0,0.06); } }
  /* Mirrors book.html: optional custom background image, with scrim + blur. */
  body.has-bg::before {
    content: ''; position: fixed; inset: 0; z-index: 0;
    background: var(--custom-bg) center/cover no-repeat;
  }
  body.has-bg::after {
    content: ''; position: fixed; inset: 0; z-index: 0;
    background: rgba(245, 243, 238, 0.55);
  }
  @media (min-width: 521px) {
    body.has-bg::after { background: rgba(229, 225, 216, 0.35); }
  }
  body.has-bg #app { background: transparent !important; box-shadow: none !important; }
  body.has-bg .card {
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  body.has-bg::after { background: rgba(245, 243, 238, 0.2) !important; }
  body.has-bg { color: #000; }
  body.has-bg .card,
  body.has-bg .card *,
  body.has-bg h1 {
    color: #000;
    text-shadow: 0 1px 2px rgba(255,255,255,0.65), 0 0 1px rgba(255,255,255,0.85);
  }
  body.has-bg .sub,
  body.has-bg .eyebrow,
  body.has-bg .muted { color: #333 !important; }
  h1 { font-family: var(--serif); font-size: 30px; font-weight: 400; letter-spacing: -0.5; margin: 4px 0 6px; line-height: 1.1; }
  .eyebrow { font-size: 11px; color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; font-weight: 500; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .back { display: inline-block; color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500; margin-bottom: 12px; }
  .card { background: var(--surface); border: 1px solid var(--hair); border-radius: 3px; padding: 28px 20px; margin-top: 20px; text-align: center; }
  .card .placeholder-mark { font-family: var(--serif); font-size: 36px; color: var(--accent); letter-spacing: 0.4px; margin-bottom: 4px; }
  .card h2 { font-family: var(--serif); font-size: 20px; color: var(--ink2); font-weight: 400; margin: 8px 0 4px; }
  .card p { font-size: 13px; color: var(--muted); line-height: 1.55; margin: 6px 0 0; }
  .item { background: var(--surface); border: 1px solid var(--hair); border-radius: 3px; overflow: hidden; margin-top: 12px; }
  .item img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--surface2); }
  .item img { cursor: zoom-in; }
  .lb { position: fixed; inset: 0; background: rgba(20,20,18,0.95); display: none; align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; }
  .lb.open { display: flex; }
  .lb img { max-width: 96vw; max-height: 92vh; object-fit: contain; }
  .item .body { padding: 14px 16px 16px; }
  .item .note { font-size: 14px; color: var(--ink2); line-height: 1.55; white-space: pre-line; word-wrap: break-word; overflow-wrap: anywhere; }
  .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .cat { display: block; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--hair); border-radius: 3px; overflow: hidden; }
  .cat .cover { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; background: var(--surface2); }
  .cat .meta { padding: 10px 12px 12px; }
  .cat .name { font-family: var(--serif); font-size: 17px; color: var(--ink); line-height: 1.2; overflow-wrap: anywhere; }
  .cat .count { font-size: 11px; color: var(--muted); margin-top: 3px; letter-spacing: 0.3px; }
  .section-label { font-size: 11px; color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; font-weight: 500; margin-top: 26px; }
  .cat-back { display: inline-block; color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500; margin-top: 14px; }
  body.has-bg .cat { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  body.has-bg .cat .name, body.has-bg .section-label { color: #000; }
  body.has-bg .cat .count { color: #333; }
  body.has-bg .item { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  body.has-bg .item .note { color: #000; text-shadow: 0 1px 2px rgba(255,255,255,0.65), 0 0 1px rgba(255,255,255,0.85); }
</style>
</head>
<body>
<div id="app">
  <a class="back" href="#" id="back">← Înapoi la program</a>
  <div class="eyebrow" id="eyebrow">Pagină</div>
  <h1 id="title">Se încarcă…</h1>
  <p class="sub" id="sub"></p>
  <div id="content"></div>
</div>

<script>
(function () {
  const parts = location.pathname.split('/').filter(Boolean);
  const slug = parts[1] || '';
  const backLink = document.getElementById('back');
  const titleEl = document.getElementById('title');
  const subEl = document.getElementById('sub');
  const eyebrowEl = document.getElementById('eyebrow');
  const content = document.getElementById('content');

  if (!slug) { titleEl.textContent = 'Link invalid'; return; }
  backLink.href = '/book/' + encodeURIComponent(slug);

  function applyBackground(d) {
    if (!d || !d.has_background) return;
    const v = Number(d.background_updated_at) || 0;
    const url = '/api/' + encodeURIComponent(slug) + '/background' + (v ? '?v=' + v : '');
    document.body.style.setProperty('--custom-bg', `url("${url}")`);
    document.body.classList.add('has-bg');
  }

  function renderDisabled() {
    eyebrowEl.textContent = 'Indisponibil';
    titleEl.textContent = 'Pagină indisponibilă';
    subEl.textContent = '';
    content.innerHTML = '<div class="card"><h2>Această pagină nu este activă</h2><p>Contactează direct providerul pentru detalii.</p></div>';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
  }

  let state = { items: [], categories: [], label: '' };

  function itemsHtml(items) {
    return items.map(it => {
      // Cards show a phone-sized preview; the full image opens on tap.
      const imgUrl = '/api/' + encodeURIComponent(slug) + '/extra-page/' + encodeURIComponent(it.id);
      const note = (it.note || '').trim();
      return '<div class="item">'
        + `<img src="${imgUrl}/thumb" data-full="${imgUrl}" alt="" loading="lazy" decoding="async" />`
        + (note ? `<div class="body"><div class="note">${escapeHtml(note)}</div></div>` : '')
        + '</div>';
    }).join('');
  }

  function currentCategory() {
    const m = location.hash.match(/^#c=([a-z0-9]+)$/);
    return m ? m[1] : null;
  }

  // Categories become sub-albums: a grid of tiles, each opening its own list.
  // Pictures without a category are listed under the tiles.
  function render() {
    const { items, categories, label } = state;
    const catId = currentCategory();
    const cat = catId && categories.find(c => c.id === catId);
    if (cat) {
      const inCat = items.filter(it => it.category_id === cat.id);
      eyebrowEl.textContent = label;
      titleEl.textContent = cat.name;
      document.title = cat.name + ' · ' + label;
      content.innerHTML = '<a class="cat-back" href="#">← ' + escapeHtml(label) + '</a>'
        + (inCat.length ? itemsHtml(inCat)
          : '<div class="card"><div class="placeholder-mark">✦</div><h2>Album gol</h2><p>Mai trece pe aici — pozele apar după ce sunt adăugate.</p></div>');
      window.scrollTo(0, 0);
      return;
    }
    eyebrowEl.textContent = 'Mai multe';
    titleEl.textContent = label;
    document.title = label;
    const withItems = categories
      .map(c => ({ c, list: items.filter(it => it.category_id === c.id) }))
      .filter(x => x.list.length);
    if (!withItems.length) { renderItems(items); return; }
    const loose = items.filter(it => !it.category_id || !categories.some(c => c.id === it.category_id));
    const tiles = withItems.map(({ c, list }) => {
      const cover = '/api/' + encodeURIComponent(slug) + '/extra-page/' + encodeURIComponent(list[0].id) + '/thumb';
      return `<a class="cat" href="#c=${c.id}">`
        + `<img class="cover" src="${cover}" alt="" loading="lazy" decoding="async" />`
        + `<div class="meta"><div class="name">${escapeHtml(c.name)}</div>`
        + `<div class="count">${list.length} ${list.length === 1 ? 'poză' : 'poze'}</div></div>`
        + '</a>';
    }).join('');
    content.innerHTML = '<div class="cats">' + tiles + '</div>'
      + (loose.length ? '<div class="section-label">Altele</div>' + itemsHtml(loose) : '');
  }

  window.addEventListener('hashchange', render);

  function renderItems(items) {
    if (!items.length) {
      content.innerHTML = '<div class="card">'
        + '<div class="placeholder-mark">✦</div>'
        + '<h2>Pagină goală</h2>'
        + '<p>Mai trece pe aici — articolele apar după ce sunt adăugate.</p>'
        + '</div>';
      return;
    }
    content.innerHTML = itemsHtml(items);
  }

  const lb = document.createElement('div');
  lb.className = 'lb';
  document.body.appendChild(lb);
  lb.addEventListener('click', () => { lb.classList.remove('open'); lb.innerHTML = ''; });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lb.classList.contains('open')) { lb.classList.remove('open'); lb.innerHTML = ''; }
  });
  content.addEventListener('click', (e) => {
    const img = e.target.closest('img[data-full]');
    if (!img) return;
    const full = document.createElement('img');
    full.src = img.dataset.full;
    full.alt = '';
    lb.innerHTML = '';
    lb.appendChild(full);
    lb.classList.add('open');
  });

  async function load() {
    try {
      const [availRes, itemsRes] = await Promise.all([
        fetch('/api/' + encodeURIComponent(slug) + '/availability', { cache: 'no-store' }),
        fetch('/api/' + encodeURIComponent(slug) + '/extra-page', { cache: 'no-store' }),
      ]);
      if (availRes.status === 404) { titleEl.textContent = 'Pagină inexistentă'; subEl.textContent = ''; return; }
      const data = await availRes.json();
      applyBackground(data);
      if (!data.public_enabled || !data.extra_page_enabled) {
        renderDisabled();
        return;
      }
      const label = (data.extra_page_title || '').trim() || 'Mai multe';
      eyebrowEl.textContent = 'Mai multe';
      titleEl.textContent = label;
      subEl.textContent = '';
      document.title = label;
      let items = [], categories = [];
      if (itemsRes.ok) {
        const payload = await itemsRes.json().catch(() => ({}));
        if (payload && payload.enabled) {
          items = payload.items || [];
          categories = payload.categories || [];
        }
      }
      state = { items, categories, label };
      render();
    } catch {
      titleEl.textContent = 'Eroare de conexiune';
      subEl.textContent = '';
    }
  }

  load();
})();
</script>
<script src="/js/promo-footer.js?v=3"></script>
</body>
</html>
